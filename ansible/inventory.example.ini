# Mẫu inventory - file thật (inventory.ini) do `terraform apply` tự sinh với IP thật.
# Chỉ dùng mẫu này nếu tự tạo máy bằng tay: copy thành inventory.ini rồi điền IP.

[app]
xuanloc-app ansible_host=203.0.113.10 private_ip=172.31.0.10

[monitoring]
xuanloc-monitoring ansible_host=203.0.113.20 private_ip=172.31.0.20

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/develops.pem
ansible_python_interpreter=/usr/bin/python3
