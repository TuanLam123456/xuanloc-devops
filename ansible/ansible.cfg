[defaults]
# inventory.ini do Terraform sinh ra (terraform/inventory.tf)
inventory = inventory.ini
# IP của EC2 mới tạo chưa có trong known_hosts -> bỏ hỏi yes/no lần đầu SSH
host_key_checking = False
interpreter_python = /usr/bin/python3
retry_files_enabled = False
# In kết quả gọn, dễ đọc
stdout_callback = default
callback_result_format = yaml

[ssh_connection]
# Gộp nhiều lệnh vào 1 kết nối SSH -> chạy nhanh hơn
pipelining = True
