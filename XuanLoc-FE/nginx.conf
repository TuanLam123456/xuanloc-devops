server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ẩn phiên bản nginx trong header trả về
    server_tokens off;

    # App dùng BrowserRouter: mọi đường dẫn không phải file thật (vd /admin/users) đều trả về index.html
    # để React Router xử lý. Thiếu dòng này thì F5 ở trang con sẽ ra 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # File trong /assets có mã hash trong tên (Vite build) -> cache lâu dài trên trình duyệt
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html không được cache, để mỗi lần deploy trình duyệt lấy bản mới
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
