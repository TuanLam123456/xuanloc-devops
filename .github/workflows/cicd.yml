# CI/CD chính của Xuân Lộc
#   1. ci     : quét secret, lint frontend, kiểm tra Prisma schema
#   2. build  : build 2 Docker image (backend, frontend) và push lên Docker Hub
#   3. deploy : SSH vào VPS app, kéo image mới và khởi động lại container
#
# Cấu hình trong GitHub repo -> Settings -> Secrets and variables -> Actions:
#   Variables: DOCKERHUB_USERNAME (lam141000), DEPLOY_ENABLED (true khi đã có server)
#   Secrets  : DOCKERHUB_TOKEN, SSH_HOST (IP VPS app), SSH_PRIVATE_KEY (nội dung develops.pem)
name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - "XuanLoc-BE/**"
      - "XuanLoc-FE/**"
      - ".github/workflows/cicd.yml"
  pull_request:
    branches: [main]
  # Cho phép bấm chạy tay trên tab Actions
  workflow_dispatch:

# Không cho 2 lần deploy chạy chồng lên nhau
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # TruffleHog cần lịch sử commit để so sánh
          fetch-depth: 0

      - name: Scan for leaked secrets (TruffleHog)
        uses: trufflesecurity/trufflehog@v3.99.7
        with:
          extra_args: --results=verified

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Lint frontend
        working-directory: XuanLoc-FE
        run: |
          npm ci
          npm run lint

      - name: Validate Prisma schema
        working-directory: XuanLoc-BE
        env:
          # Chỉ kiểm tra cú pháp schema, không kết nối DB
          DATABASE_URL: mysql://ci:ci@localhost:3306/ci
        run: |
          npm ci
          npx prisma validate

  build:
    name: Build & push ${{ matrix.service }}
    needs: ci
    # Pull request chỉ chạy CI, không push image. Chưa cấu hình Docker Hub (DOCKERHUB_USERNAME) thì bỏ qua
    if: github.event_name != 'pull_request' && vars.DOCKERHUB_USERNAME != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            context: XuanLoc-BE
            image: xuanloc-be
          - service: frontend
            context: XuanLoc-FE
            image: xuanloc-fe
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tag "latest" để server kéo về, tag theo commit SHA để có thể quay lại bản cũ
      # Frontend không truyền VITE_API_URL -> dùng URL production trong .env.production
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to app server
    needs: build
    # Chỉ deploy khi đã tạo server và bật biến DEPLOY_ENABLED=true (tắt khi terraform destroy)
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
    steps:
      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust server host key
        run: ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      # docker-compose.yml và .env trên server do Ansible tạo sẵn ở ~/xuanloc
      - name: Pull new images and restart containers
        run: |
          ssh "ubuntu@$SSH_HOST" '
            set -e
            cd ~/xuanloc
            docker compose pull backend frontend
            docker compose up -d
            docker image prune -f
          '

      - name: Health check
        run: |
          ssh "ubuntu@$SSH_HOST" '
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:3069/api/health && curl -fsS -o /dev/null http://127.0.0.1:3000/; then
                echo; echo "Backend and frontend are healthy"; exit 0
              fi
              sleep 3
            done
            echo "Health check failed"; docker compose -f ~/xuanloc/docker-compose.yml ps; exit 1
          '
